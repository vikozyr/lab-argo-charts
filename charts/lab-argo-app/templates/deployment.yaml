apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lab-argo-app.fullname" . }}
  labels:
    {{- include "lab-argo-app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "lab-argo-app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "lab-argo-app.labels" . | nindent 8 }}
    spec:
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            # Застосунок може показати свою версію (ендпоінт /version, етап 3)
            - name: APP_VERSION
              value: {{ .Values.image.tag | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
          # Образ FROM scratch без shell, тому лише HTTP-проби
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}

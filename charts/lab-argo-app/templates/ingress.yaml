{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "lab-argo-app.fullname" . }}
  labels:
    {{- include "lab-argo-app.labels" . | nindent 4 }}
  annotations:
    # cert-manager побачить анотацію і випустить сертифікат Let's Encrypt у Secret з tls.secretName
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer }}
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ include "lab-argo-app.fullname" . }}-tls
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "lab-argo-app.fullname" . }}
                port:
                  name: http
{{- end }}

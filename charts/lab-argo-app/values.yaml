replicaCount: 2
image:
  repository: docker.io/vitaliikozyr/lab-argo-app
  tag: 1.0.3 # шаблон: CI підставляє версію образу (1.0.<run_number>)
  pullPolicy: IfNotPresent
containerPort: 3000 # порт, який слухає Fiber (app.Listen(":3000"))
service:
  type: ClusterIP
  port: 80
ingress:
  enabled: true
  className: nginx
  host: app.178.128.139.187.sslip.io
  clusterIssuer: letsencrypt # ClusterIssuer з 01_installation/le-issuer.yml
resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    memory: 64Mi
